[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "auto-iterator"
version = "0.3.0"
description = "Automated implement → review → fix loop with a filesystem-backed operator CLI"
# pyratatui ships ``cp310-abi3`` wheels, so 3.10 is the floor. The
# Rust-backed bindings keep the TUI render loop in native code, which
# is what unblocks butter-smooth scrolling over high-latency SSH —
# the previous Textual implementation paid one Python-side widget
# repaint per frame and was visibly laggy.
requires-python = ">=3.10"
dependencies = [
    # pyratatui drives the interactive ``ai`` / ``ai show`` TUI. Pin
    # to the 0.2.x line: that's the first series with the
    # ``Terminal``/``AsyncTerminal``/``poll_event`` shape we rely on
    # and stable list/table state APIs. Upper bound caps the next
    # minor so a future API break can't silently land via
    # ``uv lock --upgrade``.
    "pyratatui>=0.2.7,<0.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[project.scripts]
ai = "auto_iterator.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/auto_iterator"]
